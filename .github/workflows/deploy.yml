name: Déploiement sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Le worker « assistant » n'est déployé que si le jeton Cloudflare est renseigné
      # (Settings → Secrets and variables → Actions : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID).
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt pytest usd-core
      - run: pytest pipeline/tests -q
      # Le worker n'est redéployé que si worker/ (ou ce fichier, qui fixe la version de wrangler) a
      # changé depuis le push précédent. Lancement à la main, nouvelle branche ou historique réécrit :
      # pas de comparaison sûre, on déploie.
      - name: Le worker a-t-il changé ?
        id: changes
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" != push ] || [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
             || ! git fetch --quiet --depth=1 origin "$BEFORE"; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "Pas de push précédent à comparer : le worker est déployé."
          elif git diff --quiet "$BEFORE" HEAD -- worker .github/workflows/deploy.yml; then
            echo "worker=false" >> "$GITHUB_OUTPUT"
            echo "worker/ inchangé : le worker déjà en ligne est gardé."
          else
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "worker/ a changé : le worker est redéployé."
          fi
      - name: Déploiement du worker Cloudflare (assistant)
        id: worker
        if: env.HAS_CLOUDFLARE == 'true' && steps.changes.outputs.worker == 'true'
        # Un échec ici ne bloque pas le site : il se déploie alors sans assistant.
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # Même version que worker/package-lock.json ; l'action installe sinon un wrangler 3,
          # qui ne connaît pas [[ratelimits]].
          wranglerVersion: '4.153.0'
          command: deploy
      - run: npm run build
        env:
          # Adresse du worker, inscrite dans le site au build. ASSISTANT_URL (variable du dépôt)
          # permet de la fixer à la main si elle n'est pas lue dans la sortie de wrangler.
          VITE_ASSISTANT_URL: ${{ vars.ASSISTANT_URL || steps.worker.outputs.deployment-url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
